name: Dependency Remediation

# Workflow auxiliar (ejecucion manual): regenera package-lock.json aplicando las
# actualizaciones de seguridad compatibles (npm audit fix) y hace commit del resultado.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm-audit-fix:
    name: "npm audit fix (package-lock.json)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar lockfile y aplicar correcciones de seguridad
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --omit=dev || true

      - name: Commit del lockfile actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Sin cambios en package-lock.json"
            exit 0
          fi
          git commit -m "fix(sca): actualizar dependencias vulnerables con npm audit fix"
          git push
